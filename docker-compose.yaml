services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sara
      POSTGRES_USER: sara
      POSTGRES_PASSWORD: sara
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sara -d sara"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

